<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Boom 팀 포인트 정산기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div>
<div class="container">
    <h2>[ LOL BOOM 내전 팀 밸런스 ] </h2>
    <table>
        <thead>
            <tr>
                <th>포지션</th>
                <th>1팀</th>
                <th>점수</th>
                <th>2팀</th>
                <th>점수</th>
                <th>스왑</th>
            </tr>
        </thead>
        <tbody>
           <tr>
        <td class="pos-cell">TOP</td>
        <td><input type="text" class="t1-name" placeholder="이름"></td>
        <td><input type="number" class="t1-pt"  oninput="calcSum()"></td>
        <td><input type="text" class="t2-name" placeholder="이름"></td>
        <td><input type="number" class="t2-pt" oninput="calcSum()"></td>
        <td><button type="button" class="swap-btn" onclick="swapRow(this)">⇄</button></td>
    </tr>
            <tr>
                <td class="pos-cell">JG</td>
                <td><input type="text" class="t1-name" placeholder="이름"></td>
        <td><input type="number" class="t1-pt"  oninput="calcSum()"></td>
        <td><input type="text" class="t2-name" placeholder="이름"></td>
        <td><input type="number" class="t2-pt"  oninput="calcSum()"></td>
        <td><button type="button" class="swap-btn" onclick="swapRow(this)">⇄</button></td>
            </tr>
            <tr>
                <td class="pos-cell">MID</td>
               <td><input type="text" class="t1-name" placeholder="이름"></td>
        <td><input type="number" class="t1-pt"  oninput="calcSum()"></td>
        <td><input type="text" class="t2-name" placeholder="이름"></td>
        <td><input type="number" class="t2-pt"  oninput="calcSum()"></td>
        <td><button type="button" class="swap-btn" onclick="swapRow(this)">⇄</button></td>
            </tr>
            <tr>
                <td class="pos-cell">ADC</td>
               <td><input type="text" class="t1-name" placeholder="이름"></td>
        <td><input type="number" class="t1-pt"  oninput="calcSum()"></td>
        <td><input type="text" class="t2-name" placeholder="이름"></td>
        <td><input type="number" class="t2-pt"  oninput="calcSum()"></td>
        <td><button type="button" class="swap-btn" onclick="swapRow(this)">⇄</button></td>
            </tr>
            <tr>
                <td class="pos-cell">SUP</td>
                <td><input type="text" class="t1-name" placeholder="이름"></td>
        <td><input type="number" class="t1-pt"  oninput="calcSum()"></td>
        <td><input type="text" class="t2-name" placeholder="이름"></td>
        <td><input type="number" class="t2-pt"  oninput="calcSum()"></td>
        <td><button type="button" class="swap-btn" onclick="swapRow(this)">⇄</button></td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="sum-row">
                <td >총 합</td>
                <td>1팀</td>
                <td id="t1-total" class="sum-val">0</td>
                <td>2팀</td>
                <td id="t2-total" class="sum-val">0</td>
                 <td><button type="button" class="copy-btn" onclick="copyResults()">복사</button>
</div></td>
                <div class="button-area">
                    
            </tr>
        </tfoot>
        
    </table>
    
</div>
<div class="nameii">made by seungjin</div>

</div>
<script>
    
    function calcSum() {
        const t1Inputs = document.querySelectorAll('.t1-pt');
        let t1Sum = 0;
        t1Inputs.forEach(input => {
            t1Sum += parseInt(input.value) || 0;
        });
        document.getElementById('t1-total').innerText = t1Sum;

        const t2Inputs = document.querySelectorAll('.t2-pt');
        let t2Sum = 0;
        t2Inputs.forEach(input => {
            t2Sum += parseInt(input.value) || 0;
        });
        document.getElementById('t2-total').innerText = t2Sum;
    }

    document.addEventListener('keydown', function(e) {
        if (e.target.tagName !== 'INPUT') return;

        const input = e.target;
        const td = input.parentElement;
        const tr = td.parentElement;
        const colIndex = td.cellIndex;

        if (e.key === 'ArrowDown') {
            const nextRow = tr.nextElementSibling;
            if (nextRow && nextRow.cells[colIndex]) {
                const nextInput = nextRow.cells[colIndex].querySelector('input');
                if (nextInput) { e.preventDefault(); nextInput.focus(); }
            }
        } 
       
        else if (e.key === 'ArrowUp') {
            const prevRow = tr.previousElementSibling;
            if (prevRow && prevRow.parentElement.tagName === 'TBODY' && prevRow.cells[colIndex]) {
                const prevInput = prevRow.cells[colIndex].querySelector('input');
                if (prevInput) { e.preventDefault(); prevInput.focus(); }
            }
        } 
     
        else if (e.key === 'ArrowRight') {
        
            let nextTd = td.nextElementSibling;
          
            while (nextTd) {
                const nextInput = nextTd.querySelector('input');
                if (nextInput) {
                    nextInput.focus();
                    break;
                }
                nextTd = nextTd.nextElementSibling;
            }
        } 
   
        else if (e.key === 'ArrowLeft') {
       
            let prevTd = td.previousElementSibling;
            while (prevTd) {
                const prevInput = prevTd.querySelector('input');
                if (prevInput) {
                    prevInput.focus();
                    break;
                }
                prevTd = prevTd.previousElementSibling;
            }
        }
    });
    function swapRow(btn) {
   
    const tr = btn.parentElement.parentElement;

    const t1Name = tr.querySelector('.t1-name');
    const t1Pt = tr.querySelector('.t1-pt');
    const t2Name = tr.querySelector('.t2-name');
    const t2Pt = tr.querySelector('.t2-pt');

    const tempName = t1Name.value;
    t1Name.value = t2Name.value;
    t2Name.value = tempName;

    const tempPt = t1Pt.value;
    t1Pt.value = t2Pt.value;
    t2Pt.value = tempPt;

    calcSum();
}
function copyResults() {
    
    const positions = ["탑 \t", "정글", "미드", "원딜", "서폿"];
    let textResult = "[ 내전 팀 밸런스 ]\n\n";

    const rows = document.querySelectorAll("tbody tr");
    
    rows.forEach((row, index) => {
        const pos = positions[index];
        const t1Name = row.querySelector('.t1-name').value || "미정";
        const t1Pt = row.querySelector('.t1-pt').value || "0";
        const t2Name = row.querySelector('.t2-name').value || "미정";
        const t2Pt = row.querySelector('.t2-pt').value || "0";

        textResult += `${pos}\t${t1Name}(${t1Pt})\t${t2Name}(${t2Pt})\n`;
    });
    const t1Total = document.getElementById('t1-total').innerText;
    const t2Total = document.getElementById('t2-total').innerText;
    textResult += `\n[총 합]\t\t\t${t1Total}\t:\t${t2Total}`;

    navigator.clipboard.writeText(textResult).then(() => {
        alert("복사되었습니다!");
    }).catch(err => {
        console.error('복사 실패:', err);
        alert("복사 실패");
    });
}
</script>
</body>
</html>
